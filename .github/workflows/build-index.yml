name: Build Index

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Build index.json
        run: |
          python3 - <<'EOF'
          import json, os, glob

          exams = []
          skipped = []

          for path in sorted(glob.glob("**/*.json", recursive=True)):
              if path == "index.json" or path.startswith(".github/"):
                  continue
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  meta = data.get("metadata", {})
                  sections = data.get("sections", [])
                  q_count = sum(len(s.get("questions", [])) for s in sections)
                  category = path.split("/")[0]

                  exams.append({
                      "title": meta.get("exam_title", path),
                      "category": category,
                      "questions": q_count,
                      "duration_minutes": meta.get("total_duration_minutes", 0),
                      "version": str(meta.get("version", "1.0")),
                      "path": path,
                      "raw_url": f"https://raw.githubusercontent.com/Forwarderr/ques_json/main/{path}"
                  })
                  print(f"✓ Indexed: {path}")

              except json.JSONDecodeError as e:
                  skipped.append(path)
                  print(f"✗ INVALID JSON — skipping: {path} ({e})")
              except Exception as e:
                  skipped.append(path)
                  print(f"✗ ERROR — skipping: {path} ({e})")

          output = {
              "last_updated": __import__('datetime').date.today().isoformat(),
              "total": len(exams),
              "skipped": skipped,
              "exams": exams
          }

          with open("index.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          print(f"\n✓ Built index.json — {len(exams)} exam(s) indexed, {len(skipped)} skipped")
          if skipped:
              print("Skipped files:", skipped)
          EOF

      - name: Commit index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --staged --quiet || git commit -m "chore: rebuild index.json [skip ci]"
          git push
